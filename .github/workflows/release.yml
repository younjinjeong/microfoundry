name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.25.0"
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: younjinjeong/microfoundry/mf

jobs:
  # ── Gate: tests must pass ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./... -count=1

  # ── Cross-compile binaries + create GitHub Release ─────
  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Multi-arch Docker images ───────────────────────────
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}

  # ── Package Helm chart as OCI artifact ─────────────────
  helm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/microfoundry \
            --version "$VERSION" \
            --app-version "$VERSION"
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          helm push microfoundry-${VERSION}.tgz oci://ghcr.io/younjinjeong/microfoundry/charts
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: "*.tgz"

  # ── Push image to AWS ECR (optional — requires AWS vars) ─
  ecr-push:
    needs: docker
    runs-on: ubuntu-latest
    if: vars.AWS_ACCOUNT_ID != ''
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Pull from GHCR and push to ECR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GHCR_IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${VERSION}"
          ECR_IMAGE="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/microfoundry/mf:${VERSION}"
          docker pull "${GHCR_IMAGE}"
          docker tag "${GHCR_IMAGE}" "${ECR_IMAGE}"
          docker push "${ECR_IMAGE}"
          # Also tag as latest
          docker tag "${GHCR_IMAGE}" "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/microfoundry/mf:latest"
          docker push "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/microfoundry/mf:latest"

  # ── Deploy to ECS Fargate (optional — requires AWS vars) ─
  deploy-ecs:
    needs: ecr-push
    runs-on: ubuntu-latest
    if: vars.AWS_ACCOUNT_ID != ''
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Update ECS service (force new deployment)
        run: |
          aws ecs update-service \
            --cluster microfoundry-cluster \
            --service microfoundry-admin \
            --force-new-deployment
      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster microfoundry-cluster \
            --services microfoundry-admin

  # ── Build deployment packages per CSP ──────────────────
  deployment-packages:
    needs: [goreleaser, helm]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - name: aws-ecs-fargate
            label: "AWS ECS (Fargate)"
          - name: aws-eks
            label: "AWS EKS"
          - name: gcp-gke
            label: "Google GKE"
          - name: azure-aks
            label: "Azure AKS"
          - name: local-k8s
            label: "Local Kubernetes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: ./artifacts/helm
      - name: Build deployment bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLATFORM="${{ matrix.platform.name }}"
          BUNDLE_DIR="microfoundry-${VERSION}-${PLATFORM}"
          mkdir -p "${BUNDLE_DIR}"

          # Copy platform-specific files
          if [ -d "deploy/packages/${PLATFORM}/terraform" ]; then
            cp -r "deploy/packages/${PLATFORM}/terraform" "${BUNDLE_DIR}/terraform"
          fi
          for f in helm-values.yaml mf.example.yaml install.sh README.md; do
            if [ -f "deploy/packages/${PLATFORM}/${f}" ]; then
              cp "deploy/packages/${PLATFORM}/${f}" "${BUNDLE_DIR}/${f}"
            fi
          done

          # Make install script executable
          if [ -f "${BUNDLE_DIR}/install.sh" ]; then
            chmod +x "${BUNDLE_DIR}/install.sh"
            # Inject version
            sed -i "s/VERSION=\"latest\"/VERSION=\"${VERSION}\"/" "${BUNDLE_DIR}/install.sh"
          fi

          # Include Helm chart tarball
          cp artifacts/helm/*.tgz "${BUNDLE_DIR}/" 2>/dev/null || true

          # Create the tarball
          tar czf "${BUNDLE_DIR}.tar.gz" "${BUNDLE_DIR}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform.name }}
          path: "*.tar.gz"

  # ── Attach deployment bundles to GitHub Release ────────
  attach-assets:
    needs: [goreleaser, deployment-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: ./packages
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.tar.gz
          append_body: true
          body: |

            ## Deployment Packages

            Each package contains Terraform modules, Helm values, config templates, and an install script.

            | Platform | Package | Install |
            |----------|---------|---------|
            | AWS ECS (Fargate) | `microfoundry-${{ github.ref_name }}-aws-ecs-fargate.tar.gz` | `./install.sh` |
            | AWS EKS | `microfoundry-${{ github.ref_name }}-aws-eks.tar.gz` | `./install.sh` |
            | Google GKE | `microfoundry-${{ github.ref_name }}-gcp-gke.tar.gz` | `./install.sh` |
            | Azure AKS | `microfoundry-${{ github.ref_name }}-azure-aks.tar.gz` | `./install.sh` |
            | Local K8s | `microfoundry-${{ github.ref_name }}-local-k8s.tar.gz` | `./install.sh` |

            ## Container Images

            ```
            docker pull ghcr.io/younjinjeong/microfoundry/mf:${{ github.ref_name }}
            ```

            ## Helm Chart

            ```
            helm install microfoundry oci://ghcr.io/younjinjeong/microfoundry/charts/microfoundry --version ${{ github.ref_name }}
            ```
