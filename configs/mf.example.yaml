github:
  owner: "younjinjeong"
  repo: "microfoundry"

kubernetes:
  active: "docker-desktop"
  clusters:
    docker-desktop:
      name: "docker-desktop"
      context: "docker-desktop"
      namespace: "microfoundry"
      domain: "cf-local.dev"
      provider: "docker-desktop"
      enabled: true
    # Example: Add an EKS cluster
    # my-eks-cluster:
    #   name: "Production EKS"
    #   context: "arn:aws:eks:us-east-1:123456789:cluster/my-cluster"
    #   namespace: "microfoundry"
    #   domain: "apps.example.com"
    #   provider: "eks"
    #   region: "us-east-1"
    #   enabled: true

  # Legacy single-cluster format (auto-migrated):
  # context: "docker-desktop"
  # namespace: "microfoundry"

admin:
  port: 8080
  host: "0.0.0.0"

monitoring:
  grafana_url: "http://localhost:3000"
  loki_url: "http://loki.monitoring.svc.cluster.local:3100"
  alertmanager_url: "http://kube-prometheus-kube-prome-alertmanager.monitoring.svc.cluster.local:9093"
  prometheus_url: "http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090"
  beyla_enabled: true

# Container registry (file-based defaults; admin UI settings stored in K8s take precedence)
# registry:
#   url: "harbor.local:30003"
#   project: "microfoundry"
#   username: "admin"
#   insecure: false

