apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: microfoundry-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus
    app: kube-prometheus-stack
spec:
  groups:
    - name: microfoundry.rules
      rules:
        - alert: MFAppDown
          expr: microfoundry_apps_running == 0 and microfoundry_apps_desired > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "App {{ $labels.app }} has zero running instances"
            description: "Application {{ $labels.app }} in namespace {{ $labels.namespace }} has 0 running pods but {{ $value }} desired."

        - alert: MFHighPodRestartRate
          expr: rate(kube_pod_container_status_restarts_total{namespace="microfoundry"}[15m]) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting frequently"
            description: "Pod {{ $labels.pod }} in namespace microfoundry has a high restart rate."

        - alert: MFHighMemoryUsage
          expr: |
            (container_memory_working_set_bytes{namespace="microfoundry", container!=""}
            / on(pod, container) container_spec_memory_limit_bytes{namespace="microfoundry", container!=""}) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} using >90% memory"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using more than 90% of its memory limit."

        - alert: MFDeploymentFailed
          expr: increase(microfoundry_deploy_errors_total[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Deployment failures detected"
            description: "MicroFoundry deployment errors occurred in the last 10 minutes."

        - alert: MFServiceProvisionFailed
          expr: increase(microfoundry_service_provision_total{result="error"}[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Service provisioning failures detected"
            description: "Service provisioning errors occurred in the last 10 minutes."

    - name: microfoundry.beyla.alerts
      rules:
        # Beyla heartbeat — fires when Beyla is not being scraped
        - alert: MFBeylaDown
          expr: up{job="beyla-metrics"} == 0
          for: 2m
          labels:
            severity: critical
            source: beyla
          annotations:
            summary: "Beyla eBPF instrumentation is down"
            description: "Beyla DaemonSet is not being scraped. All HTTP metrics and eBPF-based alerts are unavailable."

        - alert: MFAppHighErrorRate
          expr: microfoundry:http_error_rate:5m > 0.05
          for: 5m
          labels:
            severity: warning
            source: beyla
          annotations:
            summary: "App {{ $labels.k8s_deployment_name }} has >5% error rate"
            description: "Application {{ $labels.k8s_deployment_name }} has a 5xx error rate of {{ $value | humanizePercentage }} over the last 5 minutes."

        - alert: MFAppHighLatency
          expr: microfoundry:http_latency_p99:5m > 2
          for: 5m
          labels:
            severity: warning
            source: beyla
          annotations:
            summary: "App {{ $labels.k8s_deployment_name }} p99 latency >2s"
            description: "Application {{ $labels.k8s_deployment_name }} has a p99 latency of {{ $value | humanizeDuration }} over the last 5 minutes."

        - alert: MFAppNoTraffic
          expr: |
            microfoundry:http_request_rate:5m == 0
            and on(k8s_deployment_name) (kube_deployment_status_replicas_available{namespace="microfoundry"} > 0)
          for: 15m
          labels:
            severity: info
            source: beyla
          annotations:
            summary: "App {{ $labels.k8s_deployment_name }} has zero traffic"
            description: "Application {{ $labels.k8s_deployment_name }} is running but received no HTTP traffic in the last 15 minutes."
