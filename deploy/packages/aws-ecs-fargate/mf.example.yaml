# -----------------------------------------------------------------------------
# MicroFoundry Configuration — AWS ECS Fargate + EKS Hybrid Deployment
# -----------------------------------------------------------------------------
# This configuration runs the MicroFoundry control plane on ECS Fargate
# while managing application workloads on one or more remote EKS clusters.
#
# Place this file at /etc/microfoundry/mf.yaml inside the Fargate container
# (mounted via EFS), or set MF_CONFIG_DIR to point to its directory.
# -----------------------------------------------------------------------------

github:
  owner: ""
  repo: ""

kubernetes:
  active: "dev-eks"
  clusters:
    dev-eks:
      name: "Development (EKS)"
      eks_cluster_name: "microfoundry-eks"  # Terraform output: module.eks.cluster_name
      namespace: "microfoundry"
      domain: ""          # Set to your domain, e.g. "dev.apps.example.com"
      provider: "eks"
      region: "us-east-1"
      enabled: true
      tls: false
      ingress_class: "nginx"

    # --- Multi-cluster example (uncomment to add more EKS clusters) ---
    # staging-eks:
    #   name: "Staging (EKS)"
    #   eks_cluster_name: "microfoundry-staging-eks"
    #   namespace: "microfoundry"
    #   domain: "staging.apps.example.com"
    #   provider: "eks"
    #   region: "us-west-2"
    #   enabled: true
    #   ingress_class: "nginx"
    #
    # prod-eks:
    #   name: "Production (EKS)"
    #   eks_cluster_name: "microfoundry-prod-eks"
    #   namespace: "microfoundry"
    #   domain: "apps.example.com"
    #   provider: "eks"
    #   region: "us-east-1"
    #   enabled: true
    #   ingress_class: "alb"

admin:
  port: 8080
  host: "0.0.0.0"
  # domain: "admin.example.com"  # Set after configuring DNS to point to the ALB

# Monitoring — MicroFoundry on Fargate uses CloudWatch for container logs.
# Prometheus/Grafana/Loki URLs are left empty since they are not deployed
# alongside the Fargate control plane. If you deploy a monitoring stack on
# the EKS cluster, fill in the appropriate in-cluster service URLs.
monitoring:
  grafana_url: ""
  loki_url: ""
  alertmanager_url: ""
  prometheus_url: ""
  beyla_enabled: false

# Authentication (Keycloak OIDC)
# Uncomment and configure after deploying Keycloak on the EKS cluster.
# auth:
#   enabled: true
