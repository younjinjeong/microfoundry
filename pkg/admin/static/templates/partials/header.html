{{define "header"}}
<header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <h2 class="text-xl font-semibold text-gray-800">{{.Title}}</h2>
    <div class="flex items-center space-x-4">
        {{if .ActiveCluster}}
        <div class="flex items-center space-x-2 text-sm text-gray-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"/>
            </svg>
            <a href="/clusters" class="font-medium text-gray-700 hover:text-blue-600" data-tooltip="Active cluster. Click to manage clusters.">{{.ActiveCluster}}</a>
        </div>
        {{end}}
        {{if .User}}
        <div class="flex items-center space-x-3 border-l border-gray-200 pl-4">
            <div class="h-8 w-8 rounded-full bg-gray-900 flex items-center justify-center text-sm font-medium text-white">
                {{slice .User.Email 0 1}}
            </div>
            <div class="text-sm">
                <div class="font-medium text-gray-700">{{.User.Name}}</div>
                <div class="text-xs text-gray-400">{{.User.Email}}</div>
            </div>
            <a href="/auth/logout" class="text-xs text-gray-500 hover:text-red-600 ml-2" data-tooltip="Sign out of MicroFoundry">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
            </a>
        </div>
        {{end}}
    </div>
</header>
{{end}}
