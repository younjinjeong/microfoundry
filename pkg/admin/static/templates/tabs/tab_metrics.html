{{define "tab_metrics.html"}}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <p class="text-sm text-gray-500">Application metrics from Prometheus via Grafana</p>
        <a href="{{index . "GrafanaAppURL"}}" target="_blank"
           data-tooltip="Open full metrics dashboard in Grafana"
           class="text-sm text-blue-600 hover:underline flex items-center">
            Open in Grafana
            <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
        </a>
    </div>

    <!-- CPU and Memory panels -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-gray-50 rounded-lg p-2">
            <h4 class="text-xs font-medium text-gray-500 mb-2 px-2">CPU Usage</h4>
            <iframe src="{{index . "GrafanaCPUPanelURL"}}"
                    width="100%" height="200" frameborder="0" class="rounded" loading="lazy"></iframe>
        </div>
        <div class="bg-gray-50 rounded-lg p-2">
            <h4 class="text-xs font-medium text-gray-500 mb-2 px-2">Memory Usage</h4>
            <iframe src="{{index . "GrafanaMemPanelURL"}}"
                    width="100%" height="200" frameborder="0" class="rounded" loading="lazy"></iframe>
        </div>
    </div>

    <!-- Network and Restarts panels -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-gray-50 rounded-lg p-2">
            <h4 class="text-xs font-medium text-gray-500 mb-2 px-2">Network I/O</h4>
            <iframe src="{{index . "GrafanaNetPanelURL"}}"
                    width="100%" height="200" frameborder="0" class="rounded" loading="lazy"></iframe>
        </div>
        <div class="bg-gray-50 rounded-lg p-2">
            <h4 class="text-xs font-medium text-gray-500 mb-2 px-2">Pod Restarts</h4>
            <iframe src="{{index . "GrafanaRestartPanelURL"}}"
                    width="100%" height="200" frameborder="0" class="rounded" loading="lazy"></iframe>
        </div>
    </div>

    <!-- Logs panel -->
    <div class="bg-gray-50 rounded-lg p-2">
        <h4 class="text-xs font-medium text-gray-500 mb-2 px-2">Recent Logs (Loki)</h4>
        <iframe src="{{index . "GrafanaLogPanelURL"}}"
                width="100%" height="250" frameborder="0" class="rounded" loading="lazy"></iframe>
    </div>
</div>
{{end}}
